<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="640" height="320" fill="#FFFFFF"/>
  
  <!-- Workspace Icon: Four inward-facing corner forms + negative center -->
  <g transform="translate(120, 96)">
    <!-- Top-left diamond piece -->
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#006B5E" transform="rotate(45 11 11)"/>
    
    <!-- Top-right diamond piece -->
    <rect x="42" y="0" width="22" height="22" rx="5" fill="#006B5E" transform="rotate(45 53 11)"/>
    
    <!-- Bottom-left diamond piece -->
    <rect x="0" y="42" width="22" height="22" rx="5" fill="#006B5E" transform="rotate(45 11 53)"/>
    
    <!-- Bottom-right diamond piece -->
    <rect x="42" y="42" width="22" height="22" rx="5" fill="#006B5E" transform="rotate(45 53 53)"/>
  </g>
  
  <!-- AXA Wordmark (dominant) -->
  <text x="235" y="142" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" 
        font-size="78" font-weight="700" letter-spacing="-3" fill="#1A1A1A">AXA</text>
  
  <!-- Workspace (subordinate) -->
  <text x="238" y="186" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" 
        font-size="20" font-weight="400" letter-spacing="7" fill="#6B7280">WORKSPACE</text>
</svg>