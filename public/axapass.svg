<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="640" height="320" fill="#FFFFFF"/>
  
  <!-- Pass Icon: single vertical opening cut through a compact solid form -->
  <g transform="translate(120, 96)">
    <!-- Solid compact form -->
    <rect x="0" y="0" width="64" height="64" rx="10" fill="#2C3E50"/>
    <!-- Vertical opening (negative space) -->
    <rect x="26" y="6" width="12" height="52" rx="6" fill="#FFFFFF"/>
  </g>
  
  <!-- AXA Wordmark (dominant) -->
  <text x="235" y="142" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" 
        font-size="78" font-weight="700" letter-spacing="-3" fill="#1A1A1A">AXA</text>
  
  <!-- Pass (subordinate) -->
  <text x="238" y="186" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" 
        font-size="20" font-weight="400" letter-spacing="7" fill="#6B7280">PASS</text>
</svg>