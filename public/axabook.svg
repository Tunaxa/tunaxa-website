<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="640" height="320" fill="#FFFFFF"/>
  
  <!-- Book Icon: single interrupted circular time-path with geometric cut ends -->
  <g transform="translate(118, 96)">
    <!-- Path: large arc with squared-off gap at top-right -->
    <path d="M 32 8 L 28 8 A 24 24 0 1 0 56 32 L 56 36" 
          fill="none" 
          stroke="#3E4C59" 
          stroke-width="9" 
          stroke-linecap="square" 
          stroke-linejoin="miter"/>
  </g>
  
  <!-- AXA Wordmark (dominant) -->
  <text x="235" y="142" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" 
        font-size="78" font-weight="700" letter-spacing="-3" fill="#1A1A1A">AXA</text>
  
  <!-- Book (subordinate) -->
  <text x="238" y="186" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" 
        font-size="20" font-weight="400" letter-spacing="7" fill="#6B7280">BOOK</text>
</svg>